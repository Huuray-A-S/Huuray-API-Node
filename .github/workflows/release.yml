name: Release

# Publishes to npm when a version tag is pushed:
#
#   npm version minor && git push --follow-tags
#
# Requires an NPM_TOKEN secret with publish rights on the "huuray" package.
# Provenance is enabled, so npm records which workflow and commit built the
# tarball — that is what makes the supply chain auditable.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # required for npm provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      # workflow_dispatch only makes sense on a tag ref. Fail fast with a clear
      # message instead of burning a full install/test cycle and then failing
      # the tag check against a branch name.
      - name: Require a tag ref
        if: github.ref_type != 'tag'
        run: |
          echo "This workflow publishes from v* tags only."
          echo "Dispatched on '${GITHUB_REF_NAME}' (${{ github.ref_type }}) — pick the tag in the 'Run workflow' ref dropdown."
          exit 1

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          registry-url: https://registry.npmjs.org
          cache: npm

      - run: npm ci

      # Never publish something that does not pass its own gates.
      - run: npm run codegen
      - run: npx tsc --noEmit
      - run: npx vitest run

      - name: Check the tag matches package.json
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "Tag v$TAG does not match package.json version $PKG."
            exit 1
          fi

      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
